## Everything the build resolves from a repository. Toolchain pins match the host app - an AAR
## built by a different AGP has already broken that consumer once (coala).

[versions]
agp = "9.4.0"
# AGP 9 compiles Kotlin itself and bundles KGP 2.2.10; declaring the Kotlin plugin at the root
# (apply false) puts 2.4.20 on the classpath and makes it win.
kotlin = "2.4.20"
androidJunit5 = "2.0.1"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# androidx.lifecycle is an atomic group without a BOM; the line the host app resolves.
lifecycle = "2.11.0"
junitBom = "6.1.3"
# kotlinx.serialization runtime; the compiler plugin version is `kotlin`.
serialization = "1.11.0"
# Same line as the host app; declared through the BOM so neighbours cannot move it unnoticed.
coroutines = "1.11.0"
# Test-only; the 4.x line the host app already uses.
okhttp = "4.12.0"
# Test-only. JUnit 4 runs Robolectric through the JUnit Platform's vintage engine.
robolectric = "4.17"
junit4 = "4.13.2"
androidxTestCore = "1.7.0"
# Instrumented (device) tests; same lines as the host app.
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
# Test-only. compose-ui-test-junit4 pulls espresso-core 3.5.0, which reflects on
# InputManager.getInstance() - gone on API 37. Same version as the host app.
espresso = "3.7.0"
# 2.11.2, not 2.12.0: 2.12.0 was published 2026-09-23, under the 7-day supply-chain floor.
work = "2.11.2"
# Sample only: the Material 3 window theme (the host app's version).
material = "1.14.0"
# Test-only: taps the system screen capture consent dialog in :feedbackkit-recording's device tests.
# Not in the host app; released 2024-03, far past the 7-day supply-chain floor.
uiautomator = "2.3.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# ABI dump engine for build-logic's feedbackkit.abi-validation; must match the compiler that wrote the metadata.
kotlin-abi-tools = { module = "org.jetbrains.kotlin:abi-tools", version.ref = "kotlin" }
kotlin-abi-tools-api = { module = "org.jetbrains.kotlin:abi-tools-api", version.ref = "kotlin" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
# build-logic's feedbackkit.android-library convention plugin: the Android DSL, same version as AGP.
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit = { module = "junit:junit", version.ref = "junit4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "androidJunit5" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
