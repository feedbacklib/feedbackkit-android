# Windows Defender and the search indexer briefly open files a test has just written, so deleting a
# @TempDir can fail with DirectoryNotEmpty even though the code under test closed every stream.
# Cleanup failures are ignored (JUnit still logs them) instead of failing an otherwise green test.
junit.jupiter.tempdir.deletion.strategy.default = org.junit.jupiter.api.io.TempDirDeletionStrategy$IgnoreFailures
